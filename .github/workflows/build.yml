# Builds the mend image, pushes it to ghcr.io/jhgaylor/mend, then pins
# the immutable sha tag into k8s/deployment.yaml so Flux (home-cloud) rolls
# the exact image that was just built. Multi-arch because home-cloud's k3s
# nodes are arm64 Lima VMs. The SPA bundle is built on the runner (bun), so
# the docker stage is nginx + dist/ and needs no QEMU-side compile.
name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/**"
      - "README.md"

concurrency:
  group: build-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mend

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Test and build
        run: |
          bun install --frozen-lockfile
          bun test
          bun run build
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Pin image tag in k8s/deployment.yaml
        run: |
          sed -i -E "s#(image: ${IMAGE}:)sha-[0-9a-f]+#\1sha-${GITHUB_SHA}#" k8s/deployment.yaml
          git diff --quiet && { echo "already pinned"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "deploy: pin image sha-${GITHUB_SHA::7}"
          git push
